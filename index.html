<!DOCTYPE html>
<!--
  Public website for the publisher (GitHub Pages: https://voxagastudios.github.io).
  Upload the contents of the site/ folder to the voxagastudios.github.io repository. See docs/RELEASE.md, step 3.
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voxaga Studios</title>
    <style>
        :root {
            --bg: #1b1917;
            --surface: #2a2623;
            --text: #ece4da;
            --muted: #9c9187;
            --accent: #e0782f;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f7f3ee;
                --surface: #ffffff;
                --text: #2a2623;
                --muted: #6b625a;
                --accent: #b35418;
            }
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 16px;
        }

        h1, h2 {
            font-family: Georgia, "Times New Roman", serif;
            line-height: 1.25;
        }

        h1 {
            color: var(--accent);
        }

        a {
            color: var(--accent);
        }

        .game {
            padding: 16px;
            border-radius: 12px;
            background: var(--surface);
        }

        .muted {
            color: var(--muted);
        }
    </style>
</head>
<body>
<main>
    <h1>Voxaga Studios</h1>
    <p>Small story and roguelike games for your phone.</p>

    <h2>Games</h2>
    <div class="game">
        <h3>Fate: Ashen Road</h3>
        <p>A swipe-card survival story. Every choice costs something. How many days will you last?</p>
        <p><a href="fate/privacy.html">Privacy policy</a></p>
    </div>
</main>
</body>
</html>
